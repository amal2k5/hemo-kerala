[alembic]
# path to migration scripts
script_location = backend/alembic

# database to connect to
sqlalchemy.url =

# version location
version_locations = backend/alembic/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version table name
version_table = alembic_version

# logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
